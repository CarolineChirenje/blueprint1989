<div class="dashboard-container">

  <!-- Record Type Picker Overlay -->
  <app-record-type-picker
    [visible]="showRecordPicker"
    (typeSelected)="onRecordTypeSelected($event)"
    (pickCancelled)="onRecordPickerCancelled()">
  </app-record-type-picker>

  <div class="welcome-section">
    <h1>{{ getGreeting() }}, {{ userName }}!</h1>
    <p class="current-time">{{ currentTime | date: 'fullDate' }} - {{ currentTime | date: 'shortTime' }}</p>
  </div>

  <div class="quick-actions">
    <h2>Quick Actions</h2>
    
    <div class="cards-grid">

      <!-- Cycles Card -->
      <div class="action-card" (click)="navigateTo('/cycles')">
        <div class="card-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" style="width:3rem;height:3rem;">
            <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>
          </svg>
        </div>
        <h3>Cycles</h3>
        <p>View and manage shared expense cycles</p>
        <div class="card-arrow">→</div>
      </div>

      <!-- My Obligations Card -->
      <div class="action-card" (click)="navigateTo('/cycles')">
        <div class="card-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" style="width:3rem;height:3rem;">
            <path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/>
          </svg>
        </div>
        <h3>My Obligations</h3>
        <p>Track what you owe across active cycles</p>
        <div class="card-arrow">→</div>
      </div>

    </div>
  </div>
</div>
