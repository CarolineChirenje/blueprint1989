<div class="page-header">
  <h2>Groups</h2>
  <div class="header-actions">
    <button mat-stroked-button (click)="openJoinDialog()">
      <mat-icon>group_add</mat-icon> Join Group
    </button>
    <button mat-raised-button color="primary" (click)="openCreateDialog()">
      <mat-icon>add</mat-icon> New Group
    </button>
  </div>
</div>

<div class="content-card">

    <div *ngIf="errorMessage" class="error-banner">{{ errorMessage }}</div>

    <table mat-table [dataSource]="groups" class="shared-table clickable-rows">

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let g" data-label="Name">{{ g.name }}</td>
      </ng-container>

      <ng-container matColumnDef="memberCount">
        <th mat-header-cell *matHeaderCellDef>Members</th>
        <td mat-cell *matCellDef="let g" data-label="Members">{{ g.memberCount }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let g" data-label="Status">
          <span class="status-chip" [class.active]="g.isActive" [class.inactive]="!g.isActive">
            {{ g.isActive ? 'Active' : 'Inactive' }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef>Created</th>
        <td mat-cell *matCellDef="let g" data-label="Created">{{ g.createdAt | date:'mediumDate' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let g" class="actions-cell" data-label="">
          <ng-container *ngIf="g.canManage">
            <button mat-icon-button matTooltip="Manage members" (click)="openMembersDialog($event, g)">
              <mat-icon>people</mat-icon>
            </button>
            <button mat-icon-button matTooltip="Edit group" (click)="editGroup($event, g)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button matTooltip="Delete group" color="warn" (click)="deleteGroup($event, g)">
              <mat-icon>delete</mat-icon>
            </button>
          </ng-container>
          <button mat-icon-button matTooltip="View group details" (click)="openGroup(g)" class="view-btn">
            <mat-icon>open_in_new</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="openGroup(row)" style="cursor:pointer"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell no-data" colspan="5">No groups yet. Create one to get started.</td>
      </tr>
    </table>

</div>
