<h2 mat-dialog-title>{{ isEdit ? 'Edit Group' : 'Create Group' }}</h2>

<mat-dialog-content>
  <form [formGroup]="form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Group Name</mat-label>
      <input matInput formControlName="name" maxlength="150" placeholder="e.g. House A" />
      <mat-error *ngIf="form.get('name')?.hasError('required')">Name is required.</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Description (optional)</mat-label>
      <textarea matInput formControlName="description" rows="3" maxlength="500"></textarea>
    </mat-form-field>

    <mat-slide-toggle *ngIf="isEdit" formControlName="isActive">Active</mat-slide-toggle>
  </form>

  <div *ngIf="error" class="error-msg">{{ error }}</div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()" [disabled]="saving">Cancel</button>
  <button mat-raised-button color="primary" (click)="submit()" [disabled]="form.invalid || saving">
    <mat-spinner *ngIf="saving" diameter="18" style="display:inline-block;margin-right:6px;"></mat-spinner>
    {{ isEdit ? 'Save' : 'Create' }}
  </button>
</mat-dialog-actions>
