<h2 mat-dialog-title>Edit User</h2>

<mat-dialog-content>
  <div *ngIf="error" class="error-msg">{{ error }}</div>

  <form [formGroup]="form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>First Name</mat-label>
      <input matInput formControlName="firstName" autocomplete="off" />
      <mat-error *ngIf="form.get('firstName')?.hasError('required')">Required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Last Name</mat-label>
      <input matInput formControlName="lastName" autocomplete="off" />
      <mat-error *ngIf="form.get('lastName')?.hasError('required')">Required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" type="email" autocomplete="off" />
      <mat-error *ngIf="form.get('email')?.hasError('required')">Required</mat-error>
      <mat-error *ngIf="form.get('email')?.hasError('email')">Invalid email address</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Role</mat-label>
      <mat-select formControlName="role">
        <mat-option *ngFor="let r of roleOptions" [value]="r.value">{{ r.label }}</mat-option>
      </mat-select>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" type="button"
          [disabled]="form.invalid || saving"
          (click)="save()">
    <mat-icon *ngIf="saving" class="spin">sync</mat-icon>
    {{ saving ? 'Saving…' : 'Save' }}
  </button>
</mat-dialog-actions>
