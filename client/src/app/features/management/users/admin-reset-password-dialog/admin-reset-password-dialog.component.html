<h2 mat-dialog-title>Reset Password</h2>

<mat-dialog-content>
  <p class="subtitle">Set a new password for <strong>{{ data.user.fullName }}</strong></p>

  <div *ngIf="error" class="error-msg">{{ error }}</div>

  <form [formGroup]="form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>New Password</mat-label>
      <input matInput formControlName="newPassword" type="password" autocomplete="new-password" />
      <mat-error *ngIf="form.get('newPassword')?.hasError('required')">Required</mat-error>
      <mat-error *ngIf="form.get('newPassword')?.hasError('pattern')">
        Must be 8+ chars with uppercase, lowercase, and a number
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Confirm Password</mat-label>
      <input matInput formControlName="confirmPassword" type="password" autocomplete="new-password" />
      <mat-error *ngIf="form.get('confirmPassword')?.hasError('required')">Required</mat-error>
    </mat-form-field>

    <div *ngIf="passwordMismatch" class="error-msg">Passwords do not match</div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" type="button"
          [disabled]="form.invalid || passwordMismatch || saving"
          (click)="save()">
    <mat-icon *ngIf="saving" class="spin">sync</mat-icon>
    {{ saving ? 'Resetting…' : 'Reset Password' }}
  </button>
</mat-dialog-actions>
