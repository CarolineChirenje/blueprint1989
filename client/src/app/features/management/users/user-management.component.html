<div class="page-header">
  <h2>Users</h2>
</div>

<div class="content-card">

    <div *ngIf="errorMessage" class="error-banner">{{ errorMessage }}</div>

    <div *ngIf="isLoading" class="loading-wrap">
      <mat-spinner diameter="36"></mat-spinner>
    </div>

    <div class="table-scroll">
    <table id="users-table" mat-table [dataSource]="users" class="shared-table" *ngIf="!isLoading">

      <ng-container matColumnDef="fullName">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let u" data-label="Name">{{ u.fullName }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let u" data-label="Email">
          {{ u.email }}
          <mat-icon *ngIf="u.isEmailVerified" class="verified-icon" matTooltip="Email verified">verified</mat-icon>
          <mat-icon *ngIf="!u.isEmailVerified" class="unverified-icon" matTooltip="Email not verified">error_outline</mat-icon>
        </td>
      </ng-container>

      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef>Role</th>
        <td mat-cell *matCellDef="let u" data-label="Role">{{ u.roleName }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let u" data-label="Status">
          <span class="status-chip" [class.active]="u.isActive" [class.inactive]="!u.isActive">
            {{ u.isActive ? 'Active' : 'Inactive' }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let u" class="actions-cell" data-label="">
          <button mat-icon-button matTooltip="Manage group roles" (click)="openGroupRolesDialog(u)">
            <mat-icon>manage_accounts</mat-icon>
          </button>
          <button *ngIf="isAdminOrAbove && !u.isEmailVerified"
                  mat-icon-button
                  matTooltip="Verify email"
                  (click)="verifyEmail(u)">
            <mat-icon>mark_email_read</mat-icon>
          </button>
          <button *ngIf="isAdminOrAbove"
                  mat-icon-button
                  matTooltip="Reset password"
                  (click)="openResetPasswordDialog(u)">
            <mat-icon>lock_reset</mat-icon>
          </button>
          <button *ngIf="isAdminOrAbove"
                  mat-icon-button
                  matTooltip="Edit user"
                  (click)="openEditDialog(u)">
            <mat-icon>edit</mat-icon>
          </button>
          <button *ngIf="isAdminOrAbove"
                  mat-icon-button
                  [matTooltip]="u.isActive ? 'Deactivate user' : 'Activate user'"
                  (click)="toggleStatus(u)">
            <mat-icon>{{ u.isActive ? 'person_off' : 'person' }}</mat-icon>
          </button>
          <button *ngIf="isAdminOrAbove"
                  mat-icon-button
                  matTooltip="Delete user"
                  class="delete-btn"
                  (click)="deleteUser(u)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell no-data" colspan="5">No users found.</td>
      </tr>
    </table>
    </div>

</div>
