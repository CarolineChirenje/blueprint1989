<div class="dialog-container">
  <div class="dialog-header">
    <h2>Close Report</h2>
  </div>

  <div class="dialog-body">
    <div class="instructions">
      <p>Before closing this report, please specify the version number in which this feature or bug fix was released.</p>
    </div>

    <form [formGroup]="versionForm">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Version Number *</mat-label>
        <input matInput 
               formControlName="versionNumber" 
               placeholder="e.g., 1.0.5"
               type="text">
        <mat-hint>Format: Major.Minor.Patch (e.g., 1.0.0)</mat-hint>
        <mat-error *ngIf="isVersionInvalid()">
          {{ getVersionError() }}
        </mat-error>
      </mat-form-field>
    </form>
  </div>

  <div class="dialog-actions">
    <button mat-button (click)="cancel()">Cancel</button>
    <button mat-raised-button color="primary" 
            (click)="submit()" 
            [disabled]="!versionForm.valid">
      Close with Version
    </button>
  </div>
</div>
