<div class="change-password-container">
  <div class="change-password-card">
    <div class="icon-warning">⚠️</div>
    <h1>Password Expired</h1>
    <p class="description">
      Your password has expired. For security reasons, you must change it before accessing the system.
    </p>

    @if (errorMessage) {
      <div class="error-message">{{ errorMessage }}</div>
    }

    <form [formGroup]="passwordForm" (ngSubmit)="changePassword()">
      <div class="form-group">
        <label for="currentPassword">Current Password *</label>
        <app-password-field
          formControlName="currentPassword"
          [inputId]="'currentPassword'"
          placeholder="Enter your current password"
          [autocomplete]="'current-password'"></app-password-field>
      </div>

      <div class="form-group">
        <label for="newPassword">New Password *</label>
        <app-password-field
          formControlName="newPassword"
          [inputId]="'newPassword'"
          placeholder="Enter new password"
          [autocomplete]="'new-password'"></app-password-field>
        <small class="help-text">
          Minimum 8 characters, with uppercase, lowercase, and number
        </small>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm New Password *</label>
        <app-password-field
          formControlName="confirmPassword"
          [inputId]="'confirmPassword'"
          placeholder="Confirm new password"
          [autocomplete]="'new-password'"></app-password-field>
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="passwordForm.invalid">
        Change Password
      </button>
    </form>
  </div>
</div>
