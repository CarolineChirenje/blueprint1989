<div class="container">
  <div class="card auth-card">
    <div class="card-header">
      <h1>Forgot Password?</h1>
      <p class="subtitle">Enter your email to reset your password</p>
    </div>

    <div class="card-body">
      <!-- Success Message -->
      <div *ngIf="submitted" class="alert alert-success">
        <strong>Success!</strong>
        <p>{{ successMessage || 'If an account exists with this email, a password reset link has been sent.' }}</p>
        <p class="mt-2">
          <small>If you don't see the email, check your spam folder.</small>
        </p>
      </div>

      <!-- Error Message -->
      <div *ngIf="errorMessage && !submitted" class="alert alert-danger">
        <strong>Error!</strong>
        <p>{{ errorMessage }}</p>
      </div>

      <!-- Forgot Password Form -->
      <form *ngIf="!submitted" [ngClass]="{ 'was-validated': submitted }" novalidate>
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input
            type="email"
            class="form-control"
            [class.is-invalid]="!isValidEmail(email) && email.length > 0"
            id="email"
            placeholder="Enter your email"
            [(ngModel)]="email"
            name="email"
            required
          />
          <div class="invalid-feedback" *ngIf="!isValidEmail(email) && email.length > 0">
            Please enter a valid email address.
          </div>
        </div>

        <button
          type="button"
          class="btn btn-primary w-100"
          [disabled]="!isValidEmail(email) || loading"
          (click)="onSubmit()"
        >
          <span *ngIf="!loading">Send Reset Link</span>
          <span *ngIf="loading">
            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            Sending...
          </span>
        </button>
      </form>

      <!-- Links -->
      <div class="text-center mt-3">
        <button
          type="button"
          class="btn btn-link"
          (click)="goBackToLogin()"
        >
          ← Back to Login
        </button>
      </div>
    </div>
  </div>
</div>
