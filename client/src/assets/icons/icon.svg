<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="icon-title icon-desc">
  <title id="icon-title">Batanai</title>
  <desc id="icon-desc">A circular unity-inspired green emblem containing a pink piggy bank with a gold coin, representing shared group savings.</desc>

  <defs>
    <style>
      .ring        { fill: #237A49; }
      .ring-inner  { fill: #FFFFFF; }
      .dot         { fill: #237A49; }
      .pig-body    { fill: #EF8FA1; stroke: #FFFFFF; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
      .pig-snout   { fill: #E8899D; stroke: #FFFFFF; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
      .pig-shadow  { fill: #D6748A; opacity: 0.15; }
      .pig-light   { fill: #F7B8C5; opacity: 0.45; }
      .pig-dark    { fill: #2E2E2E; }
      .pig-nostril { stroke: #C96A7F; stroke-width: 3; stroke-linecap: round; }
      .pig-accent  { stroke: #237A49; stroke-width: 3.5; stroke-linecap: round; fill: none; opacity: 0.5; }
      .coin        { fill: #FFD700; }
      .coin-edge   { fill: none; stroke: #C8960C; stroke-width: 1.8; }
      .coin-trail  { stroke: #C8960C; stroke-width: 2; stroke-linecap: round; opacity: 0.45; }
    </style>
  </defs>

  <!-- Background: white rounded square. id="icon-bg" used by regen script for maskable variant -->
  <rect id="icon-bg" width="512" height="512" rx="72" fill="#FFFFFF"/>

  <!-- ── Unity ring (32 px thick) ──────────────────────────────────── -->
  <circle class="ring" cx="256" cy="256" r="200"/>
  <circle class="ring-inner" cx="256" cy="256" r="168"/>

  <!-- Community dots (4 members on the ring) -->
  <circle class="dot" cx="256" cy="56"  r="10"/>
  <circle class="dot" cx="456" cy="256" r="10"/>
  <circle class="dot" cx="256" cy="456" r="10"/>
  <circle class="dot" cx="56"  cy="256" r="10"/>

  <!-- ── Piggy bank (optically centered in ring) ───────────────────── -->
  <g transform="translate(256,260)">
    <!-- Drop shadow -->
    <ellipse class="pig-shadow" cx="2" cy="52" rx="58" ry="9"/>

    <!-- Body — round, plump piggy bank (1.10:1 ratio) -->
    <ellipse class="pig-body" cx="0" cy="0" rx="64" ry="58"/>

    <!-- Body highlight — light from upper-right -->
    <ellipse class="pig-light" cx="14" cy="-16" rx="34" ry="15"/>

    <!-- Snout — slightly darker pink for depth -->
    <ellipse class="pig-snout" cx="-58" cy="8" rx="18" ry="15"/>
    <line class="pig-nostril" x1="-63" y1="2" x2="-63" y2="12"/>
    <line class="pig-nostril" x1="-53" y1="2" x2="-53" y2="12"/>

    <!-- Outer ear -->
    <path class="pig-body" d="M-20,-50 L-6,-76 L10,-46 Z"/>
    <!-- Inner ear (darker pink, no stroke for depth) -->
    <path d="M-15,-52 L-6,-68 L6,-48 Z" fill="#E8899D"/>

    <!-- Legs — stubby, balanced under body -->
    <rect class="pig-body" x="-30" y="46" width="18" height="24" rx="7"/>
    <rect class="pig-body" x="14"  y="46" width="18" height="24" rx="7"/>

    <!-- Eye -->
    <circle class="pig-dark" cx="-32" cy="-8" r="4.5"/>
    <circle cx="-30.5" cy="-9.5" r="1.6" fill="#FFFFFF" opacity="0.8"/>

    <!-- Coin slot -->
    <rect class="pig-dark" x="-12" y="-42" width="28" height="6" rx="3"/>

    <!-- Tail — curly spiral -->
    <path d="M66,-2 C76,-10,84,-5,84,2 C84,9,76,12,72,9 C67,6,67,-2,72,-6 C77,-10,88,-7,90,2"
          fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Green accent arc along base -->
    <path class="pig-accent" d="M-52,36 C-38,52,40,54,54,38"/>

    <!-- ── Gold coin dropping into slot ──────────────────────────── -->
    <!-- Motion trail (two discrete dashes) -->
    <line class="coin-trail" x1="2" y1="-78" x2="2" y2="-70"/>
    <line class="coin-trail" x1="2" y1="-66" x2="2" y2="-60"/>
    <!-- Coin -->
    <circle class="coin" cx="2" cy="-54" r="8.5"/>
    <circle class="coin-edge" cx="2" cy="-54" r="5"/>
  </g>
</svg>
