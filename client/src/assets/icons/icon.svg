<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="icon-title icon-desc">
  <title id="icon-title">Batanai</title>
  <desc id="icon-desc">A circular unity-inspired green emblem containing a pink piggy bank with a gold coin, representing shared group savings.</desc>

  <defs>
    <style>
      .ring        { fill: #237A49; }
      .ring-inner  { fill: #FFFFFF; }
      .dot         { fill: #237A49; }
      .pig-body    { fill: #EF8FA1; stroke: #FFFFFF; stroke-width: 6; stroke-linejoin: round; stroke-linecap: round; }
      .pig-shadow  { fill: #E07A8E; opacity: 0.18; }
      .pig-light   { fill: #F6ABB9; opacity: 0.38; }
      .pig-dark    { fill: #2E2E2E; }
      .pig-nostril { stroke: #D76E83; stroke-width: 3; stroke-linecap: round; }
      .pig-accent  { stroke: #237A49; stroke-width: 4; stroke-linecap: round; fill: none; }
      .coin        { fill: #FFD700; }
      .coin-edge   { fill: none; stroke: #DAA520; stroke-width: 2; }
      .coin-trail  { stroke: #DAA520; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 4 4; opacity: 0.55; }
    </style>
  </defs>

  <!-- Background: white rounded square. id="icon-bg" used by regen script for maskable variant -->
  <rect id="icon-bg" width="512" height="512" rx="72" fill="#FFFFFF"/>

  <!-- ── Unity ring ────────────────────────────────────────────────── -->
  <circle class="ring" cx="256" cy="256" r="200"/>
  <circle class="ring-inner" cx="256" cy="256" r="170"/>

  <!-- Community dots (4 members on the ring) -->
  <circle class="dot" cx="256" cy="56"  r="11"/>  <!-- 12 o'clock -->
  <circle class="dot" cx="456" cy="256" r="11"/>  <!-- 3 o'clock  -->
  <circle class="dot" cx="256" cy="456" r="11"/>  <!-- 6 o'clock  -->
  <circle class="dot" cx="56"  cy="256" r="11"/>  <!-- 9 o'clock  -->

  <!-- ── Piggy bank (centered in ring) ─────────────────────────────── -->
  <g transform="translate(256,264)">
    <!-- Drop shadow -->
    <ellipse class="pig-shadow" cx="0" cy="62" rx="80" ry="12"/>

    <!-- Body -->
    <ellipse class="pig-body" cx="4" cy="0" rx="80" ry="58"/>

    <!-- Top highlight -->
    <ellipse class="pig-light" cx="18" cy="-16" rx="46" ry="16"/>

    <!-- Snout -->
    <ellipse class="pig-body" cx="-72" cy="6" rx="24" ry="20"/>
    <line class="pig-nostril" x1="-79" y1="-2" x2="-79" y2="12"/>
    <line class="pig-nostril" x1="-67" y1="-2" x2="-67" y2="12"/>

    <!-- Ear -->
    <path class="pig-body" d="M-32,-50 L-16,-76 L2,-46 Z"/>

    <!-- Legs -->
    <rect class="pig-body" x="-38" y="48" width="22" height="30" rx="8"/>
    <rect class="pig-body" x="36"  y="48" width="22" height="30" rx="8"/>

    <!-- Eye -->
    <circle class="pig-dark" cx="-48" cy="-8" r="6"/>
    <circle cx="-46" cy="-10" r="2" fill="#FFFFFF" opacity="0.7"/>

    <!-- Coin slot -->
    <rect class="pig-dark" x="-18" y="-42" width="44" height="8" rx="4"/>

    <!-- Tail -->
    <path d="M82,4 C94,-6,102,-2,102,6 C102,14,94,18,88,14 C82,10,82,4,88,-2 C94,-8,108,-6,110,6"
          fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Green accent arc along base -->
    <path class="pig-accent" d="M-70,38 C-56,62,58,64,72,40"/>

    <!-- ── Gold coin dropping into slot ──────────────────────────── -->
    <!-- Motion trail -->
    <line class="coin-trail" x1="8" y1="-82" x2="8" y2="-62"/>
    <!-- Coin -->
    <circle class="coin" cx="8" cy="-54" r="10"/>
    <circle class="coin-edge" cx="8" cy="-54" r="6"/>
  </g>
</svg>
