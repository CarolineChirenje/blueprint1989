<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="utf-8">
    <base href="/">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#237A49">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png">
    <title>Divvy</title>
    <style>
      /* Force-Dark prevention — applied before any stylesheet loads.
         Prevents Chrome Android dark theme from inverting app colours. */
      :root { color-scheme: light !important; }
      html, body { color-scheme: light !important; background-color: #f0f4f8 !important; }
      input, textarea, select {
        color-scheme: light !important;
        background-color: #ffffff !important;
        color: #333333 !important;
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
    <link rel="manifest" href="manifest.webmanifest">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app-splash" aria-hidden="true">
    <img src="assets/icons/icon.svg" alt="" />
  </div>
  <style>
    #app-splash {
      position: fixed;
      inset: 0;
      background: #1A237E;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.35s ease;
    }
    #app-splash.splash-hide { opacity: 0; pointer-events: none; }
    #app-splash img { width: 120px; height: 120px; }
  </style>
  <script>
    // In development (localhost), unregister any stale service workers to prevent blank pages.
    if ('serviceWorker' in navigator && location.hostname === 'localhost') {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        registrations.forEach(function(reg) { reg.unregister(); });
      });
    }
  </script>
    <app-root></app-root>
</body>
</html>
