site_name: Blueprint1989 Technical Docs
site_description: Technical documentation for the Blueprint1989 platform
site_author: Blueprint1989 Team
docs_dir: "docs/technical documents"
site_dir: site

theme:
  name: material
  palette:
    primary: blue
    accent: light blue
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: Home.md
  - Authentication:
    - Authentication: Authentication.md
    - Biometric Authentication: Biometric-Authentication.md
  - Core Features:
    - Dashboard: Dashboard.md
    - Profile: Profile.md
    - Notifications: Notifications.md
    - Offline Queue: Offline-Queue.md
  - Admin:
    - Management: Management.md
    - Feature & Bug Reports: Feature-Bug-Reports.md
    - App Configuration: App-Configuration.md
  - Infrastructure:
    - Push Notifications: Push-Notifications.md

plugins:
  - search

markdown_extensions:
  - tables
  - fenced_code
  - codehilite
  - toc:
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
